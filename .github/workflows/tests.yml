name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run unit tests
        run: composer test

  integration:
    name: WordPress Core ${{ matrix.wordpress }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress:
          - "6.3"
          - "latest"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, zip, intl, mysqli
          coverage: none
          tools: composer:v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Install Composer dependencies
        run: composer update --with phpunit/phpunit:^9.6 --prefer-dist --no-interaction --no-progress

      - name: Install WordPress test environment
        env:
          WP_INSTALL_TESTS_SKIP_UPDATE_CHECK: "true"
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wordpress }} true

      - name: Enable multisite test mode
        run: sed -i "s#// define( 'WP_TESTS_MULTISITE', true );#define( 'WP_TESTS_MULTISITE', true );#" /tmp/wordpress-tests-lib/wp-tests-config.php

      - name: Run WordPress Core integration tests
        run: composer test:integration
